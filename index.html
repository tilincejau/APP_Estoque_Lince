<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a4d2e">
    <title>Estoque - Lince</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME -->
    <div id="tela-home" class="app-container">
        <img src="https://i.postimg.cc/x1Dpgf8n/capa-app-logistica-(400-x-400-px)-(2).png" alt="Logo Lince" class="logo">
        <h2 class="titulo-tela" style="font-size: 20px;">Controle de Estoque</h2>
        <div class="desenvolvedor">Desenvolvido por João Marcelo Magon Bonini</div>
        <button class="btn-principal" onclick="abrirHistorico('validade')">📦 Controle de Validade</button>
        <button class="btn-principal" onclick="abrirHistorico('vasilhame')" style="background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);">🍾 Controle de Vasilhame</button>
    </div>

    <!-- TELA HISTÓRICO -->
    <div id="tela-historico" class="app-container" style="display: none; padding-bottom: 80px;">
        <button class="btn-secundario" style="padding: 10px; width: 100px; margin-bottom: 10px;" onclick="voltarPara('tela-home')">⬅ Voltar</button>
        <h2 class="titulo-tela" style="font-size: 18px; text-transform: uppercase;" id="titulo-historico">HISTÓRICO</h2>
        <div id="lista-historico"></div>
        <button class="btn-floating" id="btn-nova-contagem" onclick="novaContagem()">Fazer nova contagem</button>
    </div>

    <!-- TELA DETALHES DO DIA -->
    <div id="tela-dia" class="app-container" style="display: none; padding-bottom: 80px;">
        <button class="btn-secundario" style="padding: 10px; width: 100px; margin-bottom: 10px;" onclick="voltarPara('tela-historico')">⬅ Voltar</button>
        <h2 class="titulo-tela" style="font-size: 18px;" id="titulo-dia">Data: --/--/----</h2>
        <div id="lista-registros-dia"></div>
        
        <button class="btn-principal" style="background: #10b981; margin-top: 15px;" id="btn-gerar-relatorio" onclick="gerarRelatorioDia()">📊 Gerar Relatório Deste Dia</button>
        <button class="btn-floating" onclick="novoRegistroDia()">Adicionar Item</button>
    </div>

    <!-- TELA FORMULÁRIO (UNIFICADO PARA NOVO/EDITAR) -->
    <div id="tela-form" class="app-container" style="display: none;">
        <button class="btn-secundario" style="padding: 10px; width: 100px; margin-bottom: 10px;" onclick="voltarPara('tela-dia')">⬅ Cancelar</button>
        
        <div class="card" id="form-container">
            <h3 class="card-titulo" id="titulo-form">📝 Lançamento</h3>
            <input type="hidden" id="form-linha">
            <input type="hidden" id="form-raw-data">
            
            <label class="info-label">Data / Hora:</label>
            <input type="text" id="form-data-hora" class="input-campo travado" readonly>
            
            <label class="info-label" id="label-usuario" style="display:none;">Usuário:</label>
            <input type="text" id="form-usuario" class="input-campo" style="display:none;" placeholder="Seu nome">

            <!-- Campos Vasilhame -->
            <div id="campos-vasilhame" style="display: none;">
                <label class="info-label">Vasilhame Padrão: <span style="color:red">*</span></label>
                <select id="form-vasilhame" class="input-campo"></select>

                <label class="info-label">Local da Contagem: <span style="color:red">*</span></label>
                <select id="form-local" class="input-campo">
                    <option value="DEPÓSITO">Depósito</option>
                    <option value="ENTREGA">Entrega</option>
                    <option value="CARRETA">Carreta</option>
                </select>

                <div style="display: flex; gap: 8px;">
                    <div style="flex:1;"><label class="info-label">CX Completas:</label><input type="number" id="form-completas" class="input-campo" value="0"></div>
                    <div style="flex:1;"><label class="info-label">GF Avulsas:</label><input type="number" id="form-avulsas" class="input-campo" value="0"></div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div style="flex:1;"><label class="info-label">CX Incompletas:</label><input type="number" id="form-incompletas" class="input-campo" value="0"></div>
                    <div style="flex:1;"><label class="info-label">Barril:</label><input type="number" id="form-barril" class="input-campo" value="0"></div>
                </div>
            </div>

            <!-- Campos Validade -->
            <div id="campos-validade" style="display: none;">
                <label class="info-label">Produto: <span style="color:red">*</span></label>
                <input type="text" id="form-produto" class="input-campo" list="lista-produtos" placeholder="Pesquise o produto...">
                <datalist id="lista-produtos"></datalist>

                <div style="display: flex; gap: 8px;">
                    <div style="flex:1;"><label class="info-label">Qtd. Caixas:</label><input type="number" id="form-caixas" class="input-campo" value="0"></div>
                    <div style="flex:1;"><label class="info-label">Qtd. Unidades:</label><input type="number" id="form-unidades" class="input-campo" value="0"></div>
                </div>

                <label class="info-label">Data de Validade: <span style="color:red">*</span></label>
                <input type="date" id="form-data-validade" class="input-campo">
            </div>

            <button class="btn-principal" id="btn-salvar" onclick="salvarFormulario()">💾 Salvar Lançamento</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
